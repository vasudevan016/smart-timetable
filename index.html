<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIITS | Smart Timetable</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1b4b">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
                        brand: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up-banner': 'slideUpBanner 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUpBanner: { '0%': { opacity: '0', transform: 'translateY(100px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #030712 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .hide { display: none !important; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans antialiased flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Automatic Install Banner -->
    <div id="install-banner" class="hide fixed bottom-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[400px] z-[100] glass-panel rounded-2xl p-4 flex items-center justify-between shadow-2xl border border-brand-500/30 animate-slide-up-banner bg-gray-900/90">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center shadow-lg flex-shrink-0">
                <i class="fa-solid fa-download text-white"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-white tracking-wide">Install App</h3>
                <p class="text-[11px] text-gray-400">Add to home screen for offline use</p>
            </div>
        </div>
        <div class="flex gap-1 items-center">
            <button id="close-install-btn" class="p-2 text-gray-500 hover:text-white transition-colors h-10 w-10 flex items-center justify-center rounded-lg"><i class="fa-solid fa-xmark"></i></button>
            <button id="install-btn" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold py-2.5 px-4 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all uppercase tracking-wider">Install</button>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="hide flex flex-col items-center justify-center min-h-screen px-4 animate-fade-in relative">
        <div class="glass-panel p-8 md:p-10 rounded-3xl w-full max-w-md text-center border-t border-t-brand-500/50 relative overflow-hidden shadow-2xl z-10">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-brand-500 rounded-b-full shadow-[0_0_20px_rgba(59,130,246,0.8)]"></div>
            <i class="fa-solid fa-bolt text-5xl text-transparent bg-clip-text bg-gradient-to-br from-brand-400 to-indigo-600 mb-6"></i>
            <h1 class="text-3xl font-extrabold mb-2 tracking-tight">Smart Timetable</h1>
            <p class="text-gray-400 mb-8 text-sm">Sync your academic schedule instantly.</p>
            
            <form id="login-form" class="space-y-5">
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="roll-input" placeholder="Roll Number (e.g., S20260020364)" required
                        class="w-full pl-11 pr-4 py-3.5 bg-gray-900/80 border border-gray-700/50 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all text-white placeholder-gray-600 uppercase font-mono text-sm tracking-wider shadow-inner">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_30px_rgba(37,99,235,0.5)] flex items-center justify-center gap-2">
                    Access Dashboard <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p id="error-msg" class="text-red-400 text-sm mt-2 hide bg-red-900/20 py-2 rounded-lg border border-red-500/20"></p>
            </form>
        </div>
        <div class="absolute bottom-8 text-[11px] text-gray-600 font-bold tracking-[0.2em] opacity-60 uppercase">Vasudevan M</div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hide flex flex-col min-h-screen animate-fade-in">
        
        <!-- Navbar -->
        <nav class="glass-panel sticky top-0 z-50 px-4 md:px-8 py-3 flex justify-between items-center border-b border-gray-800/50">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-calendar-check text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight hidden sm:block leading-none mb-1">IIITS Schedule</h1>
                    <div id="live-clock" class="text-xs font-mono text-brand-400 font-semibold tracking-widest hidden sm:block"></div>
                </div>
            </div>
            <div class="flex items-center gap-4 md:gap-6">
                <button id="notify-btn" class="text-gray-400 hover:text-yellow-400 transition-colors tooltip relative group">
                    <i class="fa-solid fa-bell text-lg"></i>
                </button>
                <div class="text-right flex flex-col items-end">
                    <span id="user-name" class="font-bold text-sm md:text-base bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400"></span>
                    <span id="user-details" class="text-xs font-mono text-brand-400 font-semibold tracking-wide bg-brand-900/30 px-2 py-0.5 rounded mt-1 border border-brand-500/20"></span>
                </div>
                <button id="logout-btn" class="bg-gray-800/80 hover:bg-red-500/20 hover:text-red-400 text-gray-400 h-10 w-10 rounded-xl transition-all border border-gray-700/50 flex items-center justify-center group">
                    <i class="fa-solid fa-power-off group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
        </nav>

        <!-- Widened container (w-full px-4) to fit 6 columns perfectly -->
        <main class="flex-grow p-4 md:p-6 w-full max-w-[100%] mx-auto flex flex-col">
            <div class="mb-6 mt-2">
                <h2 id="greeting-text" class="text-3xl md:text-4xl font-extrabold tracking-tight mb-1"></h2>
                <p id="status-text" class="text-gray-400 font-medium"></p>
            </div>

            <!-- Single Page Grid Container (lg:grid-cols-6 ensures 6 columns side-by-side) -->
            <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3 lg:gap-4 flex-grow">
                <!-- Dynamically populated by JS -->
            </div>
            
            <div class="mt-8 mb-2 text-center text-[11px] text-gray-600 font-bold tracking-[0.2em] opacity-60 uppercase">Vasudevan M</div>
        </main>
    </div>

    <script>
        let studentData = {}, timetableData = {}, currentUser = null;
        let notifiedClasses = new Set(), trackerInterval = null, clockInterval = null;
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e; 
            document.getElementById('install-banner').classList.remove('hide');
        });
        document.getElementById('close-install-btn').addEventListener('click', () => { document.getElementById('install-banner').classList.add('hide'); });
        document.getElementById('install-btn').addEventListener('click', async () => {
            document.getElementById('install-banner').classList.add('hide'); 
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                await deferredPrompt.userChoice;
                deferredPrompt = null; 
            }
        });

        async function initApp() {
            try {
                const [studentRes, timetableRes] = await Promise.all([ fetch('students.json'), fetch('timetable.json') ]);
                studentData = await studentRes.json();
                timetableData = await timetableRes.json();
                
                const savedRoll = localStorage.getItem('iiits_saved_roll');
                if (savedRoll) {
                    const student = Object.values(studentData).find(s => s.Roll && s.Roll.toUpperCase() === savedRoll);
                    if (student) {
                        currentUser = student;
                        currentUser.CleanName = sanitizeName(currentUser.Name);
                        loadDashboard();
                        return; 
                    }
                }
                document.getElementById('login-screen').classList.remove('hide');
            } catch (err) { console.error("Failed to load JSON files.", err); }
        }

        function sanitizeName(rawName) {
            if (!rawName) return "Student";
            let name = rawName.replace(/S202\d{7}/gi, ''); 
            name = name.replace(/\S+@\S+\.\S+/g, ''); 
            name = name.replace(/\b(ECE|CSE|AI&DS|AIDS|Sec\d+)\b/gi, ''); 
            name = name.replace(/[^a-zA-Z\s]/g, '').replace(/\s+/g, ' ').trim(); 
            return name || "Student";
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const rawInput = document.getElementById('roll-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            let student = null;

            if (rawInput.startsWith('?')) {
                const searchName = rawInput.substring(1).toLowerCase().trim();
                student = Object.values(studentData).find(s => s.Name && sanitizeName(s.Name).toLowerCase().includes(searchName));
            } else {
                const rollInput = rawInput.toUpperCase();
                student = Object.values(studentData).find(s => s.Roll && s.Roll.toUpperCase() === rollInput);
            }
            
            if (student) {
                currentUser = student;
                currentUser.CleanName = sanitizeName(currentUser.Name); 
                if (!rawInput.startsWith('?')) localStorage.setItem('iiits_saved_roll', currentUser.Roll);
                errorMsg.classList.add('hide');
                loadDashboard();
            } else {
                errorMsg.innerText = rawInput.startsWith('?') ? "Secret lookup failed: Name not found." : "Roll number not found.";
                errorMsg.classList.remove('hide');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            currentUser = null;
            localStorage.removeItem('iiits_saved_roll');
            document.getElementById('dashboard-screen').classList.add('hide');
            document.getElementById('login-screen').classList.remove('hide');
            document.getElementById('roll-input').value = '';
            if(trackerInterval) clearInterval(trackerInterval);
            if(clockInterval) clearInterval(clockInterval);
        });

        function updateClock() {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function loadDashboard() {
            document.getElementById('login-screen').classList.add('hide');
            document.getElementById('dashboard-screen').classList.remove('hide');
            document.getElementById('user-name').innerText = currentUser.CleanName;
            document.getElementById('user-details').innerText = `${currentUser.Roll} • ${currentUser.Branch}`;

            if(clockInterval) clearInterval(clockInterval);
            updateClock();
            clockInterval = setInterval(updateClock, 1000);

            updateGreeting();
            renderSchedule();
            
            if(trackerInterval) clearInterval(trackerInterval);
            trackerInterval = setInterval(() => {
                checkUpcomingClasses();
                renderSchedule(); 
            }, 60000);
        }

        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting = hour < 12 ? "Good Morning" : hour < 17 ? "Good Afternoon" : "Good Evening";
            document.getElementById('greeting-text').innerText = `${greeting}, ${currentUser.CleanName.split(' ')[0]}.`;
        }

        function parseTime(timeStr) {
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!match) return new Date();
            let hours = parseInt(match[1]);
            if (match[3].toUpperCase() === 'PM' && hours < 12) hours += 12;
            if (match[3].toUpperCase() === 'AM' && hours === 12) hours = 0;
            const d = new Date(); d.setHours(hours, parseInt(match[2]), 0, 0);
            return d;
        }

        function checkUpcomingClasses() {
            if (Notification.permission !== "granted") return;
            const currentDayStr = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date().getDay()];
            const dayData = timetableData["UG1"]?.[currentDayStr];
            if (!dayData) return;

            Object.keys(dayData).forEach(timeStr => {
                const startTime = parseTime(timeStr.split(' - ')[0]);
                const diffMinutes = (startTime - new Date()) / 60000;
                
                if (diffMinutes > 0 && diffMinutes <= 10) {
                    const myClass = dayData[timeStr].find(slot => {
                        if (slot.branch === "ALL" || slot.branch === currentUser.Branch) return true;
                        for (const [courseGrp, sec] of Object.entries(currentUser.Sections)) {
                            if (slot.course === courseGrp || (slot.base && courseGrp.includes(slot.base))) return slot.section === sec;
                        }
                        return false;
                    });
                    if (myClass && !notifiedClasses.has(timeStr)) {
                        new Notification("Upcoming Class", { body: `${myClass.course} starts in 10 minutes at ${myClass.room}.`, icon: "icon.png" });
                        notifiedClasses.add(timeStr);
                    }
                }
            });
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';
            
            const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const now = new Date();
            const currentDayStr = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][now.getDay()];
            let totalClasses = 0;

            const colors = {
                "CP": "bg-blue-900/20 border-blue-500/30 text-blue-300",
                "DLD": "bg-red-900/20 border-red-500/30 text-red-300",
                "DSMA": "bg-emerald-900/20 border-emerald-500/30 text-emerald-300",
                "OCW": "bg-purple-900/20 border-purple-500/30 text-purple-300",
                "EE": "bg-amber-900/20 border-amber-500/30 text-amber-300",
                "EDL": "bg-pink-900/20 border-pink-500/30 text-pink-300",
                "FHVE": "bg-indigo-900/20 border-indigo-500/30 text-indigo-300"
            };

            daysOfWeek.forEach(day => {
                const dayData = timetableData["UG1"]?.[day];
                const isToday = day === currentDayStr;
                
                let dayHTML = `
                    <div class="glass-panel rounded-2xl p-4 border flex flex-col h-full ${isToday ? 'border-brand-500/60 shadow-[0_0_30px_rgba(59,130,246,0.15)] bg-brand-900/10' : 'border-gray-800/50 hover:border-gray-700/80 transition-colors'}">
                        <div class="flex items-center justify-between mb-4 border-b border-gray-700/50 pb-3">
                            <h3 class="font-extrabold text-lg ${isToday ? 'text-brand-400' : 'text-gray-200'} tracking-tight">${day}</h3>
                            ${isToday ? '<span class="bg-brand-500 text-white text-[9px] font-bold px-2 py-0.5 rounded shadow-[0_0_10px_rgba(59,130,246,0.5)] uppercase tracking-wider animate-pulse-slow">Today</span>' : ''}
                        </div>
                        <div class="space-y-3 flex-grow">
                `;

                if (!dayData) {
                    dayHTML += `<div class="p-4 text-center text-gray-500 text-xs font-medium rounded-xl border border-dashed border-gray-700 bg-black/20 h-full flex items-center justify-center">No schedule data.</div></div></div>`;
                    container.innerHTML += dayHTML;
                    return; 
                }

                let classCount = 0;
                let nextClassFound = false;

                Object.keys(dayData).forEach(timeStr => {
                    const slots = dayData[timeStr];
                    const [startStr, endStr] = timeStr.split(' - ');
                    const startTime = parseTime(startStr), endTime = parseTime(endStr);

                    const myClass = slots.find(slot => {
                        if (slot.branch === "ALL" || slot.branch === currentUser.Branch) return true;
                        for (const [courseGrp, sec] of Object.entries(currentUser.Sections)) {
                            if (slot.course === courseGrp || (slot.base && courseGrp.includes(slot.base))) return slot.section === sec;
                        }
                        return false;
                    });

                    if (myClass) {
                        classCount++;
                        totalClasses++;
                        let style = colors[myClass.base] || "bg-gray-800/50 border-gray-600/50 text-gray-300";
                        let statusBadge = '', cardOutline = 'border-transparent', progressHTML = '';
                        
                        if (isToday) {
                            if (now >= startTime && now <= endTime) {
                                const totalMins = (endTime - startTime) / 60000;
                                const percentage = Math.min(100, Math.max(0, ((now - startTime) / 60000) / totalMins * 100));
                                const minsLeft = Math.ceil(totalMins - ((now - startTime) / 60000));
                                
                                statusBadge = `<span class="absolute -top-2.5 -right-2 bg-gradient-to-r from-emerald-400 to-green-500 text-gray-900 text-[9px] tracking-widest font-extrabold px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(52,211,153,0.5)] z-10">LIVE</span>`;
                                cardOutline = "border-emerald-500/50 shadow-[0_0_20px_rgba(16,185,129,0.1)] bg-emerald-900/20";
                                
                                progressHTML = `
                                    <div class="mt-3 w-full bg-gray-900 rounded-full h-1 overflow-hidden border border-gray-700/50">
                                        <div class="bg-gradient-to-r from-emerald-500 to-green-400 h-1 rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                                    </div>
                                    <div class="text-right text-[10px] text-emerald-400 mt-1 font-mono font-bold">${minsLeft}m left</div>
                                `;
                            } else if (now < startTime && !nextClassFound) {
                                statusBadge = `<span class="absolute -top-2.5 -right-2 bg-gradient-to-r from-amber-400 to-yellow-500 text-gray-900 text-[9px] tracking-widest font-extrabold px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(251,191,36,0.4)] z-10">NEXT</span>`;
                                cardOutline = "border-amber-500/40 bg-amber-900/10";
                                nextClassFound = true;
                            }
                        }
                        
                        dayHTML += `
                            <div class="p-3 rounded-xl border ${style} ${cardOutline} relative backdrop-blur-md">
                                ${statusBadge}
                                <div class="flex justify-between items-start mb-1 gap-2">
                                    <span class="font-extrabold text-sm tracking-wide leading-tight">${myClass.course} ${myClass.section || ''}</span>
                                    <span class="text-[9px] font-mono bg-black/50 border border-white/10 px-1.5 py-0.5 rounded text-gray-300 flex-shrink-0">${myClass.room}</span>
                                </div>
                                <div class="text-[11px] font-medium opacity-70 flex items-center">
                                    <i class="fa-regular fa-clock mr-1.5"></i> ${startStr} - ${endStr}
                                </div>
                                ${progressHTML}
                            </div>
                        `;
                    }
                });

                if (classCount === 0) {
                    dayHTML += `<div class="p-4 text-center text-gray-500 text-xs font-medium rounded-xl border border-dashed border-gray-700 bg-black/20 h-full flex items-center justify-center">No classes scheduled.</div>`;
                }
                
                dayHTML += `</div></div>`;
                container.innerHTML += dayHTML;
            });

            document.getElementById('status-text').innerText = `You have ${totalClasses} total classes scheduled for this week.`;
        }
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed:', err)); });
        }
        
        initApp();
    </script>
</body>
</html>
